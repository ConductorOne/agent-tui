# release-plz config.
#
# Reference: https://release-plz.dev/docs/config
#
# Behavior we want for v0.x:
#   - Watch main; open a "Release PR" that bumps the workspace version
#     when there are unreleased changes.
#   - DO NOT publish to crates.io. Workspace internals are unstable
#     until v1.0; we ship binaries via GitHub Releases (cargo-dist).
#   - Only release the top-level `agent-tui` binary crate. Inner
#     crates (protocol, daemon, adapter, …) are workspace internals
#     and don't get their own tags.
#   - Tag format `v<X>.<Y>.<Z>[-<prerelease>]`, which matches what
#     cargo-dist's release.yml expects.

# ---------------------------------------------------------------------------
# Changelog generation (inline git-cliff config).
#
# release-plz drives git-cliff internally to build the changelog. With NO
# `[changelog]` section it falls back to git-cliff's stock defaults, which
# produced a noise `### Other` dump: release-plz's own `chore(agent-tui):
# release vX.Y.Z` commits, GitHub `Merge pull request #N ...` commits, and
# every pre-conventional historical commit were dumped together, ungrouped.
#
# This `[changelog]` block fixes the noise by skipping merge + release commits
# in `commit_parsers`, and the body/header below reproduce the existing
# Keep-a-Changelog format and `compare/vA...vB` links so the file's
# look-and-feel is unchanged.
#
# WHY THE FULL-HISTORY FILE IS REGENERATED BY A SCRIPT, NOT `git cliff -o`:
#   git-cliff assigns each commit to a release by walking the WHOLE history in
#   one pass and bucketing commits under the nearest tag. Two properties of
#   this repo's history break that single-pass walk:
#
#     a. OFF-BY-ONE ATTRIBUTION. Release PRs merged with a MERGE COMMIT put the
#        `chore: release vX.Y.Z` commit (the commit each tag points at) on a
#        LATER commit-date than the feature commits it ships. git-cliff's
#        date-ordered walk then files those feature commits under the PREVIOUS
#        tag — e.g. fix(wait) #93 (range v0.1.11..v0.1.12) drifted to 0.1.11.
#
#     b. MISSING LATEST/RELEASE-ONLY VERSIONS. The skip rules below drop the
#        tag-pointed `chore: release` commit. A version whose ONLY own commit is
#        that skipped commit (0.1.12, 0.1.10, 0.1.7, 0.1.2) ends up empty, so
#        git-cliff omits its section header entirely — including the latest
#        shipped tag.
#
#   Neither `topo_order` nor dropping the skip rules corrects (a): the merge
#   topology + date inversion is intrinsic to a single full-history pass. So the
#   committed file is regenerated DETERMINISTICALLY by scripts/regen-changelog.sh,
#   which renders each tag from its OWN explicit `vPREV..vTAG` range — pinning
#   every commit to the correct release so attribution physically cannot drift.
#   The incremental path below (release-plz prepending the next section) is NOT
#   affected by (a): release-plz builds the new section from <last-tag>..HEAD,
#   which is correct as long as the last tag sits on the first-parent line.
#
# RECURRENCE — IMPORTANT REPO SETTING:
#   Both (a) and the latent risk to the incremental path are triggered by
#   *merge-commit* Release PRs. Release PRs MUST be SQUASH-merged so the release
#   commit + its tag land directly on main's first-parent line with a
#   monotonic date. Set the repo to squash-merge (Settings -> General -> "Allow
#   squash merging", and ideally disable "Allow merge commits" for the release
#   flow), or always choose "Squash and merge" when merging a release-plz PR.
#   Skipping merge commits below neutralizes the *noise* regardless, but only
#   squash-merging the Release PR keeps the per-tag *ranges* — and therefore the
#   incremental section release-plz prepends — correct going forward. If a
#   future Release PR is ever merge-committed again, re-run
#   scripts/regen-changelog.sh to repair attribution.
# ---------------------------------------------------------------------------
[changelog]
# Keep-a-Changelog header (unchanged from the existing file).
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

## [Unreleased]
"""

# One H2 per release with a `compare/vA...vB` link (matches the existing file),
# then conventional-commit groups. Only the commit subject line is rendered
# (squashed PR bodies are dropped). `(#N)` references are linkified below.
body = """
{% if version %}\
{% if previous.version %}\
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/ConductorOne/agent-tui/compare/{{ previous.version }}...{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% endif %}\
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = false

# Don't let any commit_parser silently swallow a breaking change.
protect_breaking_commits = true

# NOTE on pre-conventional historical commits ("initial scaffolding: ...",
# "P0 closure: ...", etc.): raw git-cliff's default `filter_unconventional =
# true` would drop them before commit_parsers run. release-plz's [changelog]
# schema does NOT expose that knob (and rejects it), but release-plz already
# keeps unconventional commits — they flow into the catch-all `.*` "Other"
# bucket below. The standalone history-regen script (scripts/regen-changelog.sh)
# sets filter_unconventional=false explicitly because it drives git-cliff
# directly, where the default WOULD drop them.

# Match the existing `v{{ version }}` tag scheme.
tag_pattern = "v[0-9].*"

# Stable within-section ordering.
sort_commits = "oldest"

# Linkify `(#123)` PR references into the project's pull-request URLs,
# preserving the `([#123](.../pull/123))` style already in the file.
commit_preprocessors = [
  { pattern = "\\(#([0-9]+)\\)", replace = "([#${1}](https://github.com/ConductorOne/agent-tui/pull/${1}))" },
]

# Commit grouping. ORDER MATTERS: the skip rules MUST come first so a release
# or merge commit is dropped before the catch-all `.*` bucket can claim it.
commit_parsers = [
  # --- noise: skip merge commits + release-plz's own release commits ---
  { message = "^Merge ", skip = true },
  { message = "^chore\\(.*\\): release", skip = true },   # chore(agent-tui): release vX.Y.Z
  { message = "^chore\\(release\\)", skip = true },        # chore(release): ...
  { message = "^chore: release", skip = true },            # chore: release ...
  { message = "^.*: release v[0-9]", skip = true },        # any "...: release vX.Y.Z"
  { message = "^release v[0-9]", skip = true },            # bare "release vX.Y.Z"

  # --- real, conventional commits -> Keep-a-Changelog-ish groups ---
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^ci", group = "CI/CD" },
  { message = "^build", group = "Build" },
  { message = "^chore", group = "Other" },

  # Catch-all: keep genuinely unparseable-but-real commits in a tidy "Other"
  # bucket rather than dropping them (filter_commits stays off / default).
  { message = ".*", group = "Other" },
]

[workspace]
# Don't run `cargo publish` on inner crates. Top-level publishing is
# also disabled below for v0.x.
publish = false

# Single tag per workspace release (vs one tag per crate). Matches
# the "one binary, one version" reality of agent-tui.
#
# release-plz pushes the tag but does NOT create the GitHub Release.
# cargo-dist (release.yml) owns the GitHub Release + asset uploads: it
# runs `gh release create v<X.Y.Z> … artifacts/*` and its generated
# notes already carry the install instructions + download table. If
# release-plz ALSO created the release (git_release_enable = true, the
# default), the two collide — cargo-dist's "Create GitHub Release" step
# fails with "a release with the same tag name already exists". So:
#   git_tag_enable   (default true)  -> release-plz creates + pushes the tag,
#                                       which triggers cargo-dist
#   git_release_enable = false       -> release-plz leaves the GitHub Release
#                                       to cargo-dist
git_release_enable = false
git_tag_name = "v{{ version }}"

# Conventional commits drive the changelog.
changelog_update = true

# Per-package overrides.
[[package]]
name = "agent-tui"
# This is the only crate that ends up in a release. (publish=false
# above means we still don't push to crates.io for v0.x — flip when
# we want crates.io distribution.)
release = true

# Inner workspace crates — don't cut individual releases for them.
[[package]]
name = "agent-tui-protocol"
release = false

[[package]]
name = "agent-tui-daemon"
release = false

[[package]]
name = "agent-tui-adapter"
release = false

[[package]]
name = "agent-tui-engine"
release = false

[[package]]
name = "agent-tui-engine-alacritty"
release = false

[[package]]
name = "agent-tui-engine-wezterm"
release = false

[[package]]
name = "agent-tui-recorder"
release = false

[[package]]
name = "xtask"
release = false
