[package]
name = "agent-tui-daemon"
description = "Long-lived per-session daemon for agent-tui. Speaks JSON-RPC line protocol on a Unix-domain socket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dev-dependencies]
base64 = "0.22"
async-trait = "0.1"
proptest = { workspace = true }
# Decode `snapshot --png` output in the rasterization e2e to assert real,
# correctly-dimensioned images (not stubs).
png = "0.17"

# Non-blocking `kill(pid, 0)` liveness probe for the orphan-reap e2e. A
# blocking `std::process::Command("kill")` starves the current-thread tokio
# runtime when polled in a loop, so we probe directly via libc instead.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[dependencies]
agent-tui-protocol = { workspace = true }
agent-tui-engine = { workspace = true }
agent-tui-engine-wezterm = { workspace = true }
agent-tui-engine-alacritty = { workspace = true }
agent-tui-adapter = { workspace = true }
agent-tui-recorder = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
portable-pty = "0.9"
regex = { workspace = true }
base64 = "0.22"
dirs = "5.0"
async-trait = "0.1"
hex = { workspace = true }
rand = { workspace = true }
interprocess = { workspace = true }
# `snapshot --png` rasterization. `png` (MIT/Apache, pure-Rust deflate via
# miniz_oxide — no system libs, cross-compiles cleanly) encodes the RGB
# framebuffer; `font8x8` (MIT, pure const bitmap data) supplies glyphs. Both
# are lean and avoid pulling in the full `image` codec stack.
png = "0.17"
font8x8 = "0.3"

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }
libc = "0.2"
# rustix gives us cross-platform `pipe_with(CLOEXEC)` and `ptsname`
# without per-OS cfg-splits. Features kept minimal.
rustix = { version = "1.1", features = ["fs", "pipe", "pty"] }

[target.'cfg(windows)'.dependencies]
# GenerateConsoleCtrlEvent for SIGINT/SIGBREAK delivery; daemon uses
# portable-pty's TerminateProcess via ChildKiller for SIGTERM/SIGKILL.
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation"] }
