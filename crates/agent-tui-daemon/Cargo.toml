[package]
name = "agent-tui-daemon"
description = "Long-lived per-session daemon for agent-tui. Speaks JSON-RPC line protocol on a Unix-domain socket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dev-dependencies]
base64 = "0.22"
async-trait = "0.1"
proptest = { workspace = true }
# Decode `snapshot --png` output in the rasterization e2e to assert real,
# correctly-dimensioned images (not stubs).
png = "0.17"

# Non-blocking `kill(pid, 0)` liveness probe for the orphan-reap e2e. A
# blocking `std::process::Command("kill")` starves the current-thread tokio
# runtime when polled in a loop, so we probe directly via libc instead.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[dependencies]
agent-tui-protocol = { workspace = true }
agent-tui-engine = { workspace = true }
agent-tui-engine-wezterm = { workspace = true }
agent-tui-engine-alacritty = { workspace = true }
agent-tui-adapter = { workspace = true }
agent-tui-recorder = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
portable-pty = "0.9"
regex = { workspace = true }
base64 = "0.22"
dirs = "5.0"
async-trait = "0.1"
hex = { workspace = true }
rand = { workspace = true }
interprocess = { workspace = true }
# `snapshot --png` rasterization. `png` (MIT/Apache, pure-Rust deflate via
# miniz_oxide — no system libs, cross-compiles cleanly) encodes the RGB
# framebuffer; `fontdue` (MIT/Apache, pure-Rust TrueType rasterizer) renders
# anti-aliased glyphs from the embedded JetBrains Mono TTF (see assets/).
# Both are lean and avoid the full `image` codec stack.
png = "0.17"
fontdue = "0.9"
# Window-chrome post-process pass for `snapshot --png --chrome` (BSD-3-Clause,
# pure-Rust 2D raster — no system libs, cross-compiles cleanly). Used only to
# composite the marketing frame (padding, rounded corners, title bar, drop
# shadow) over the already-rasterized cell grid; the cell renderer is untouched.
tiny-skia = "0.11"

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }
libc = "0.2"
# rustix gives us cross-platform `pipe_with(CLOEXEC)` and `ptsname`
# without per-OS cfg-splits. Features kept minimal.
rustix = { version = "1.1", features = ["fs", "pipe", "pty"] }

[target.'cfg(windows)'.dependencies]
# OpenProcess / WaitForSingleObject / CloseHandle power the `--monitor-parent`
# owner-death watch (server::parent_pid_monitor). SIGINT/SIGBREAK are delivered
# by writing ETX/FS to the ConPTY input (handlers::signal) and SIGTERM/SIGKILL
# via the taskkill descendant-tree kill (pty.rs), so no Console feature is needed.
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation"] }
