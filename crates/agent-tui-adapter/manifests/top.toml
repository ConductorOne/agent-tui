version = 2
name = "top"
root = "top"

[detect]
argv0 = ["top"]

# top layout (default): system summary (5 lines), task list header
# (1 line), processes (rest).
[[regions]]
id = "summary"
role = "summary"
rows = [0, 4]

[[regions]]
id = "task-header"
role = "table-header"
rows = [5, 6]

[[regions]]
id = "processes"
role = "table"
rows = [7, -1]
