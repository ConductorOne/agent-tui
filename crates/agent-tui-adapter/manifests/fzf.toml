version = 2
name = "fzf"
root = "fzf"

[detect]
argv0 = ["fzf"]
argv_contains = ["fzf"]

# fzf layout (default reverse-flow):
#   Row 0    : query prompt (`> needle`)
#   Row 1    : counter (`23/45`)
#   Rows 2-N : candidate list
[[regions]]
id = "query"
role = "input"
rows = [0, 0]
focus = "cursor"

[[regions]]
id = "counter"
role = "status"
rows = [1, 1]

[[regions]]
id = "candidates"
role = "list"
rows = [2, -1]
