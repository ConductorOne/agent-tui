version = 2
name = "claude-code"
root = "claude"

[detect]
argv0 = ["claude", "claude-code"]
argv_contains = ["claude", "claude-code"]
argv_excludes = ["--print", "--help", "--version"]

# Provider-specific screen contract for driving a live Claude Code-like
# session from another agent. These refs describe the visible terminal UI;
# provider stream/tool semantics still require a richer adapter.
[[regions]]
id = "response"
role = "response"
rows = "above-last-non-empty"

[[regions]]
id = "input"
role = "input"
rows = "last-non-empty"
focus = "cursor"

[[signals]]
id = "approval"
role = "approval-request"
source = "response"
regex = "(?im)(approval:.*|permission required.*|approve.*continue.*)"
name = "approval requested"

[[signals]]
id = "tool"
role = "tool-call"
source = "response"
regex = "(?im)(?:tool|command):\\s*([^\\n]+)"
name = "tool call"

[[signals]]
id = "file-change"
role = "file-change"
source = "response"
regex = "(?im)(?:status:\\s*)?file-change\\s+([^\\n]+)"
name = "file changed"

[[signals]]
id = "done"
role = "done"
source = "response"
regex = "(?im)(?:status:\\s*)?done\\b"
name = "done"
