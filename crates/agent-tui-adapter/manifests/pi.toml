version = 2
name = "pi"
root = "pi"

[detect]
argv0 = ["pi"]
argv_contains = ["pi"]
argv_excludes = ["--print", "--help", "--version"]

# Provider-specific screen contract for driving a live Pi CLI session from
# another agent. This is a terminal-screen adapter, not a replacement for Pi's
# SDK/harness event stream.
[[regions]]
id = "response"
role = "response"
rows = "above-last-non-empty"

[[regions]]
id = "input"
role = "input"
rows = "last-non-empty"
focus = "cursor"

[[signals]]
id = "approval"
role = "approval-request"
source = "response"
regex = "(?im)(approval:.*|permission required.*|approve.*continue.*)"
name = "approval requested"

[[signals]]
id = "tool"
role = "tool-call"
source = "response"
regex = "(?im)(?:tool|command):\\s*([^\\n]+)"
name = "tool call"

[[signals]]
id = "file-change"
role = "file-change"
source = "response"
regex = "(?im)(?:status:\\s*)?file-change\\s+([^\\n]+)"
name = "file changed"

[[signals]]
id = "done"
role = "done"
source = "response"
regex = "(?im)(?:status:\\s*)?done\\b"
name = "done"
