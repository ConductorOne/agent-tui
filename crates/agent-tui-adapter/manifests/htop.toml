version = 2
name = "htop"
root = "htop"

[detect]
argv0 = ["htop", "btop", "btop4linux"]
argv_contains = ["htop"]

# htop layout: meters + summary at top, process table, F-key footer.
[[regions]]
id = "meters"
role = "meters"
rows = [0, 7]

[[regions]]
id = "processes"
role = "table"
rows = [8, -2]

[[regions]]
id = "fkeys"
role = "footer"
rows = [-1, -1]
