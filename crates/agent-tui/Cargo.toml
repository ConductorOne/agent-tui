[package]
name = "agent-tui"
description = "A headless terminal browser for LLM agents — single static binary CLI + daemon."
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "agent-tui"
path = "src/main.rs"

[dependencies]
agent-tui-protocol = { workspace = true }
agent-tui-daemon = { workspace = true }
agent-tui-engine = { workspace = true }
agent-tui-engine-wezterm = { workspace = true }
agent-tui-engine-alacritty = { workspace = true }
agent-tui-recorder = { workspace = true }
agent-tui-adapter = { workspace = true }

tokio = { workspace = true }
clap = { workspace = true }
# Shell-completion and man-page generation from the clap surface.
clap_complete = "4.5"
clap_mangen = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
base64 = "0.22"
toml = "0.8"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
interprocess = { workspace = true }

[dev-dependencies]
# Integration tests under `tests/` drive the built `agent-tui` binary as a
# subprocess and parse its `--json` envelopes / decode `--raw` payloads.
serde_json = { workspace = true }
base64 = "0.22"
