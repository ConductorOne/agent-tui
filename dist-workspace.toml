[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.28.0"
# CI backends to support
ci = "github"
# The installers to generate for each app.
#   - shell: `install.sh` script. curl-pipe-able from the GH Release.
#   - powershell: `install.ps1` for Windows.
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax).
# musl targets ride along so we have static binaries available for
# container images later.
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
# Don't try to publish from PR builds — only validate the plan.
pr-run-mode = "plan"
# Override dist's default ubuntu-20.04 (EOL) with 24.04.
github-custom-runners.global = "ubuntu-24.04"
