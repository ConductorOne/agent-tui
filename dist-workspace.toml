[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.28.0"
# CI backends to support
ci = "github"
# The generated GitHub release workflow is intentionally hardened in-repo
# because cargo-dist does not expose knobs for every security setting we need.
allow-dirty = ["ci"]
# The installers to generate for each app.
#   - shell: `install.sh` script. curl-pipe-able from the GH Release.
#   - powershell: `install.ps1` for Windows.
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax).
# musl targets ride along so we have static binaries available for
# container images later.
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
# Don't try to publish from PR builds — only validate the plan.
pr-run-mode = "plan"
# Override dist 0.28's default runners — its built-in defaults
# (macos-13, ubuntu-20.04, windows-2019) are all deprecated/EOL on
# GitHub-hosted runners, which causes the matrix build jobs to
# queue forever.
[dist.github-custom-runners]
global = "ubuntu-24.04"

[dist.github-custom-runners.aarch64-apple-darwin]
runner = "macos-14"

[dist.github-custom-runners.x86_64-apple-darwin]
# macos-14 is Apple silicon; cargo cross-builds the x86_64 binary.
runner = "macos-14"

[dist.github-custom-runners.aarch64-unknown-linux-gnu]
runner = "ubuntu-24.04"

[dist.github-custom-runners.x86_64-unknown-linux-gnu]
runner = "ubuntu-24.04"

[dist.github-custom-runners.aarch64-unknown-linux-musl]
runner = "ubuntu-24.04"

[dist.github-custom-runners.x86_64-unknown-linux-musl]
runner = "ubuntu-24.04"

[dist.github-custom-runners.x86_64-pc-windows-msvc]
runner = "windows-2022"
