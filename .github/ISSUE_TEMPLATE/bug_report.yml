name: Bug report
description: Report a reproducible agent-tui bug.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please include enough detail for a maintainer to reproduce it locally.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: agent-tui version
      description: Output of `agent-tui --version`.
      placeholder: "agent-tui 0.2.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: arch
    attributes:
      label: Architecture
      placeholder: "aarch64, x86_64"
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal / shell
      placeholder: "Terminal.app + zsh, Alacritty + bash, Windows Terminal + PowerShell"
  - type: input
    id: target
    attributes:
      label: Target program
      description: The child app you spawned or drove.
      placeholder: "vim, htop, psql, lazygit"
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal command sequence that triggers the bug.
      render: shell
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Diagnostics
      description: Paste relevant `agent-tui doctor` output, daemon logs, or a small asciicast if available.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Anything else useful for debugging.
