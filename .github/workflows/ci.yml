name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    # IPC is interprocess::local_socket on every platform (Unix sockets on
    # Linux/macOS, named pipes on Windows). Signals are cfg-gated so Windows
    # gets GenerateConsoleCtrlEvent + TerminateProcess instead of killpg.
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  integration-docker:
    # Runs the containerized real-world TUI suite (see
    # docs/research/testcontainers-spike.md). Linux-only — Docker is
    # pre-installed on GitHub's ubuntu-latest runners. The build step
    # is required because the harness mounts the host's just-built
    # target/debug/agent-tui binary into each container.
    name: integration (docker)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build agent-tui binary
        run: cargo build --bin agent-tui
      - name: Run integration suite
        run: cargo test -p agent-tui-integration --features docker -- --nocapture
      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-artifacts
          path: target/integration-artifacts/
          if-no-files-found: ignore
