name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

permissions:
  contents: read

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    # IPC is interprocess::local_socket on every platform (Unix sockets on
    # Linux/macOS, named pipes on Windows). Signals are cfg-gated so Windows
    # gets GenerateConsoleCtrlEvent + TerminateProcess instead of killpg.
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: cargo test --workspace

  coverage:
    # Non-blocking workspace line-coverage report (cargo-llvm-cov).
    # Tracks the coverage from the test-hardening effort so it doesn't
    # silently regress, and uploads `lcov.info` as an artifact. There is
    # deliberately NO hard %-gate: a threshold would flake the build more
    # than it would protect. Consumers who want gating can wire the
    # artifact into Codecov/Coveralls later.
    #
    # Denominator excludes (per the coverage gap report):
    #   - crates/xtask         — dev tooling, never shipped
    #   - agent-tui-engine-wezterm — a documented non-public placeholder
    #     engine (not on crates.io yet); counting it as "uncovered" is
    #     noise.
    # Intentional code stubs stay cold BY DESIGN and are annotated at
    # their source: `eval` ("lands with adapters in P2", server.rs) and
    # `doctor --fix` / `--diagnostic-bundle` ("land in P1", commands.rs).
    #
    # Default features only: the bwrap/docker integration suites run in
    # their own jobs (a sandbox + a separate llvm-cov target dir make
    # instrumenting them here fragile); folding their coverage in is a
    # worthwhile but separate follow-up.
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - uses: taiki-e/install-action@e2ba4a39dc7bf116c8a572366d98fadc69b818f5 # cargo-llvm-cov
      - name: Workspace coverage (lcov + summary)
        run: |
          set -euxo pipefail
          IGNORE='crates/(xtask|agent-tui-engine-wezterm)/'
          cargo llvm-cov --workspace \
            --ignore-filename-regex "$IGNORE" \
            --lcov --output-path lcov.info
          {
            echo '### Workspace coverage (xtask + wezterm placeholder excluded)';
            echo '```';
            cargo llvm-cov report --ignore-filename-regex "$IGNORE" --summary-only;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload lcov artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error

  integration-docker:
    # Runs the containerized real-world TUI suite (see
    # docs/research/testcontainers-spike.md). Linux-only — Docker is
    # pre-installed on GitHub's ubuntu-latest runners. The build step
    # is required because the harness mounts the host's just-built
    # target/debug/agent-tui binary into each container.
    name: integration (docker)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Add musl target + install musl tooling
        # ubuntu-latest's cargo build links against the runner's glibc
        # (currently 2.39), which is newer than what debian:bookworm-
        # slim and most fixture base images ship (2.36). The musl
        # target produces a fully-static binary that runs on any libc.
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build agent-tui binary (musl-static)
        run: cargo build --bin agent-tui --target x86_64-unknown-linux-musl
      - name: Build fixture images
        run: |
          set -euxo pipefail
          for d in crates/agent-tui-integration/fixtures/*/; do
            name=$(basename "$d")
            docker build -t "agent-tui-fixture-${name}:dev" "$d"
          done
      - name: Run integration suite
        env:
          AGENT_TUI_BINARY: ${{ github.workspace }}/target/x86_64-unknown-linux-musl/debug/agent-tui
        run: cargo test -p agent-tui-integration --features docker -- --nocapture
      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-artifacts-docker
          path: target/integration-artifacts/
          if-no-files-found: ignore

  integration-bwrap:
    # Same integration suite, different sandbox runtime. The fixture
    # Dockerfiles are built once (via `scripts/dev/build-rootfs.sh`),
    # exported to rootfs tarballs, and bwrap rebases each test into a
    # fresh sandbox in ~5ms — vs Docker's ~3s container start. See
    # crates/agent-tui-integration/src/bwrap.rs for the design.
    #
    # Runs in parallel with integration-docker as a cross-check: both
    # backends consume the same fixture source, so a regression in
    # either points to a daemon-side bug rather than runtime drift.
    # Also: this is the path that works locally in restricted dev
    # environments where nested containers are blocked.
    name: integration (bwrap)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Install bubblewrap + podman
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap podman
      - name: Enable unprivileged user namespaces
        # Ubuntu 24.04 (ubuntu-latest) restricts unprivileged user
        # namespaces via AppArmor — bwrap then fails with
        # `setting up uid map: Permission denied`. Disable the
        # restriction so bwrap can `--unshare-user`. Runner-local
        # change; doesn't affect downstream consumers.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
      - name: Build agent-tui binary
        run: cargo build --bin agent-tui
      - name: Build fixture rootfs tarballs
        # `build-rootfs.sh` caches via .hash stamps so reruns skip
        # already-built fixtures whose Dockerfile tree is unchanged.
        run: PODMAN="sudo podman" ./scripts/dev/build-rootfs.sh
      - name: Run integration suite (bwrap)
        # GH Actions runners don't allow `bwrap --unshare-net`'s
        # loopback setup (RTM_NEWADDR fails). Share the host netns —
        # safe because no integration fixture makes network calls.
        env:
          AGENT_TUI_BWRAP_SHARE_NET: "1"
        run: cargo test -p agent-tui-integration --features bwrap -- --nocapture
      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-artifacts-bwrap
          path: target/integration-artifacts/
          if-no-files-found: ignore
