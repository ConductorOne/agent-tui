name: _arm-probe

# THROWAWAY: probes whether the ConductorOne org has the `ubuntu-24.04-arm`
# GitHub-hosted runner available (GHCR-A2 STEP 0 gate). Removed before merge.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Report native arch
        run: |
          echo "uname -m: $(uname -m)"
          echo "RUNNER_OS=$RUNNER_OS RUNNER_ARCH=$RUNNER_ARCH"
          test "$(uname -m)" = "aarch64" && echo "ARM64_RUNNER_OK" || (echo "NOT ARM64" && exit 1)
