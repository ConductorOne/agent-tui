name: ghcr

# Publish a multi-arch (linux/amd64 + linux/arm64) binary-only image to
# ghcr.io/conductorone/agent-tui. KISS: ONE buildx job emits the multi-arch
# manifest directly (QEMU-emulated arm64 — agent-tui is a lean Rust binary), not
# a split-native-runner + digest-merge dance.
#
# - push to main / v* tag / manual dispatch -> build AND push.
# - pull_request -> build BOTH platforms but DO NOT push (rot-guard: proves the
#   Dockerfile + multi-arch build stay green without writing to GHCR).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: build + publish (multi-arch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Only authenticate when we intend to push (skipped on pull_request).
      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          # metadata-action lowercases the image name, so the mixed-case
          # ${{ github.repository }} (ConductorOne/agent-tui) resolves to
          # ghcr.io/conductorone/agent-tui.
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build (push on non-PR; rot-guard build-only on PR)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
