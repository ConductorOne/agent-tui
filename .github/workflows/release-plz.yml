# release-plz: watches main, opens a Release PR that bumps the
# workspace version and regenerates CHANGELOG.md when commits land
# since the last release. Merging that PR creates the tag `v<X.Y.Z>`.
#
# That tag MUST trigger .github/workflows/release.yml (cargo-dist) to
# build the platform binaries. GitHub deliberately will NOT run workflows
# in response to events (the tag push) created by the default
# `secrets.GITHUB_TOKEN` — an anti-recursion safeguard. So if release-plz
# pushes the tag using GITHUB_TOKEN, cargo-dist never fires and the
# release ships with zero assets (this is what happened for v0.1.1-v0.1.3).
#
# Fix: mint a GitHub App installation token and hand it to release-plz.
# A tag pushed with a GitHub App token IS allowed to trigger other
# workflows, so cargo-dist's `on: push: tags` fires as intended.
#
# Reference: https://release-plz.dev/docs/github/token#use-a-github-app
name: release-plz

on:
  push:
    branches: [main]

# Both jobs need the same git history, so dedupe via concurrency.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz-release:
    name: release-plz release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # release-plz hits /repos/{owner}/{repo}/commits/{sha}/pulls to
      # look up PR metadata for the changelog. Without this perm the
      # action 403s. See https://release-plz.dev/docs/github/token.
      pull-requests: read
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          # App token (not GITHUB_TOKEN) so the tag release-plz pushes is
          # allowed to trigger release.yml (cargo-dist). release-plz uses
          # this env for both its API calls and the git push.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  release-plz-pr:
    name: release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
